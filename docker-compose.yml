name: digital-hero-orchestrator

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: digital-hero-orchestrator:latest
    restart: unless-stopped
    ports:
      - "8991:8991"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8991
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Không dùng các biến *_BASE_URL dành cho chế độ chạy trực tiếp: giá trị
      # 127.0.0.1 của chúng sẽ trỏ nhầm về chính container orchestrator.
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:8005}
      LLM_WS_BASE_URL: ${DOCKER_LLM_WS_BASE_URL:-ws://host.docker.internal:8005}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TTS_BASE_URL: ${DOCKER_TTS_BASE_URL:-http://host.docker.internal:8989}
      LIPSYNC_BASE_URL: ${DOCKER_LIPSYNC_BASE_URL:-http://host.docker.internal:8990}

      CHARACTER_ID: ${CHARACTER_ID:-to_vinh_dien}
      CHARACTER_OVERRIDES_JSON: ${CHARACTER_OVERRIDES_JSON:-}
      PORTRAIT_DIR: /app/portraits
      VOICE_ID: ${VOICE_ID:-001}
      IMAGE_ID: ${IMAGE_ID:-001}
      VO_THI_SAU_VOICE_ID: ${VO_THI_SAU_VOICE_ID:-002}
      VO_THI_SAU_IMAGE_ID: ${VO_THI_SAU_IMAGE_ID:-002}
      KIM_DONG_VOICE_ID: ${KIM_DONG_VOICE_ID:-003}
      KIM_DONG_IMAGE_ID: ${KIM_DONG_IMAGE_ID:-003}
      LE_VAN_TAM_VOICE_ID: ${LE_VAN_TAM_VOICE_ID:-004}
      LE_VAN_TAM_IMAGE_ID: ${LE_VAN_TAM_IMAGE_ID:-004}
      NGUYEN_VAN_TROI_VOICE_ID: ${NGUYEN_VAN_TROI_VOICE_ID:-005}
      NGUYEN_VAN_TROI_IMAGE_ID: ${NGUYEN_VAN_TROI_IMAGE_ID:-005}
      LE_HONG_PHONG_VOICE_ID: ${LE_HONG_PHONG_VOICE_ID:-006}
      LE_HONG_PHONG_IMAGE_ID: ${LE_HONG_PHONG_IMAGE_ID:-006}
      NGUYEN_BINH_KHIEM_VOICE_ID: ${NGUYEN_BINH_KHIEM_VOICE_ID:-007}
      NGUYEN_BINH_KHIEM_IMAGE_ID: ${NGUYEN_BINH_KHIEM_IMAGE_ID:-007}
      NGUYEN_BA_NGOC_VOICE_ID: ${NGUYEN_BA_NGOC_VOICE_ID:-008}
      NGUYEN_BA_NGOC_IMAGE_ID: ${NGUYEN_BA_NGOC_IMAGE_ID:-008}
      LE_CHAN_VOICE_ID: ${LE_CHAN_VOICE_ID:-009}
      LE_CHAN_IMAGE_ID: ${LE_CHAN_IMAGE_ID:-009}
      LE_NGOC_HAN_VOICE_ID: ${LE_NGOC_HAN_VOICE_ID:-010}
      LE_NGOC_HAN_IMAGE_ID: ${LE_NGOC_HAN_IMAGE_ID:-010}
      DINH_NUP_VOICE_ID: ${DINH_NUP_VOICE_ID:-011}
      DINH_NUP_IMAGE_ID: ${DINH_NUP_IMAGE_ID:-011}
      NGO_QUYEN_VOICE_ID: ${NGO_QUYEN_VOICE_ID:-012}
      NGO_QUYEN_IMAGE_ID: ${NGO_QUYEN_IMAGE_ID:-012}
      QUANG_TRUNG_NGUYEN_HUE_VOICE_ID: ${QUANG_TRUNG_NGUYEN_HUE_VOICE_ID:-013}
      QUANG_TRUNG_NGUYEN_HUE_IMAGE_ID: ${QUANG_TRUNG_NGUYEN_HUE_IMAGE_ID:-013}
      LE_LOI_VOICE_ID: ${LE_LOI_VOICE_ID:-014}
      LE_LOI_IMAGE_ID: ${LE_LOI_IMAGE_ID:-014}
      CHARACTER_IMAGE_PATH: /app/character-images/001
      VO_THI_SAU_IMAGE_PATH: /app/character-images/002
      KIM_DONG_IMAGE_PATH: /app/character-images/003
      LE_VAN_TAM_IMAGE_PATH: /app/character-images/004
      NGUYEN_VAN_TROI_IMAGE_PATH: /app/character-images/005
      LE_HONG_PHONG_IMAGE_PATH: /app/character-images/006
      NGUYEN_BINH_KHIEM_IMAGE_PATH: /app/character-images/007
      NGUYEN_BA_NGOC_IMAGE_PATH: /app/character-images/008
      LE_CHAN_IMAGE_PATH: /app/character-images/009
      LE_NGOC_HAN_IMAGE_PATH: /app/character-images/010
      DINH_NUP_IMAGE_PATH: /app/character-images/011
      NGO_QUYEN_IMAGE_PATH: /app/character-images/012
      QUANG_TRUNG_NGUYEN_HUE_IMAGE_PATH: /app/character-images/013
      LE_LOI_IMAGE_PATH: /app/character-images/014

      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-900}
      LIPSYNC_TIMEOUT_SECONDS: ${LIPSYNC_TIMEOUT_SECONDS:-3600}
      VIDEO_DOWNLOAD_TIMEOUT_SECONDS: ${VIDEO_DOWNLOAD_TIMEOUT_SECONDS:-300}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
      - ${CHARACTER_PORTRAITS_HOST_DIR:-./assets}:/app/portraits:ro
      # Local dùng SVG chờ. Trên SSH, các biến *_HOST_PATH trỏ tới ảnh thật.
      - ${TO_VINH_DIEN_IMAGE_HOST_PATH:-${CHARACTER_IMAGE_HOST_PATH:-${CHARACTER_IMAGE_PATH:-./assets/placeholder.svg}}}:/app/character-images/001:ro
      - ${VO_THI_SAU_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/002:ro
      - ${KIM_DONG_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/003:ro
      - ${LE_VAN_TAM_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/004:ro
      - ${NGUYEN_VAN_TROI_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/005:ro
      - ${LE_HONG_PHONG_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/006:ro
      - ${NGUYEN_BINH_KHIEM_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/007:ro
      - ${NGUYEN_BA_NGOC_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/008:ro
      - ${LE_CHAN_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/009:ro
      - ${LE_NGOC_HAN_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/010:ro
      - ${DINH_NUP_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/011:ro
      - ${NGO_QUYEN_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/012:ro
      - ${QUANG_TRUNG_NGUYEN_HUE_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/013:ro
      - ${LE_LOI_IMAGE_HOST_PATH:-./assets/placeholder.svg}:/app/character-images/014:ro
