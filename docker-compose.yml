name: digital-hero-orchestrator

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: digital-hero-orchestrator:latest
    restart: unless-stopped
    ports:
      - "8991:8991"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8991
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Không dùng các biến *_BASE_URL dành cho chế độ chạy trực tiếp: giá trị
      # 127.0.0.1 của chúng sẽ trỏ nhầm về chính container orchestrator.
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:8005}
      LLM_WS_BASE_URL: ${DOCKER_LLM_WS_BASE_URL:-ws://host.docker.internal:8005}
      TTS_BASE_URL: ${DOCKER_TTS_BASE_URL:-http://host.docker.internal:8989}
      LIPSYNC_BASE_URL: ${DOCKER_LIPSYNC_BASE_URL:-http://host.docker.internal:8990}

      CHARACTER_ID: ${CHARACTER_ID:-to_vinh_dien}
      VOICE_ID: ${VOICE_ID:-001}
      IMAGE_ID: ${IMAGE_ID:-001}
      VO_THI_SAU_VOICE_ID: ${VO_THI_SAU_VOICE_ID:-002}
      VO_THI_SAU_IMAGE_ID: ${VO_THI_SAU_IMAGE_ID:-002}
      CHARACTER_IMAGE_PATH: /app/character-images/001
      VO_THI_SAU_IMAGE_PATH: /app/character-images/002

      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-900}
      LIPSYNC_TIMEOUT_SECONDS: ${LIPSYNC_TIMEOUT_SECONDS:-3600}
      VIDEO_DOWNLOAD_TIMEOUT_SECONDS: ${VIDEO_DOWNLOAD_TIMEOUT_SECONDS:-300}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
      # Local dùng SVG chờ. Trên SSH, hai biến *_HOST_PATH trỏ tới 001.jpg/002.jpg.
      - ${TO_VINH_DIEN_IMAGE_HOST_PATH:-${CHARACTER_IMAGE_HOST_PATH:-${CHARACTER_IMAGE_PATH:-./assets/001.svg}}}:/app/character-images/001:ro
      - ${VO_THI_SAU_IMAGE_HOST_PATH:-./assets/002.svg}:/app/character-images/002:ro
