    <path d="M170 1080c24-354 118-554 280-554s256 200 280 554z"/>
    <path d="M276 337c17-137 84-214 177-214 94 0 159 77 174 214-48-47-109-70-177-70-66 0-124 23-174 70z"/>
  </g>
  <rect width="900" height="1100" filter="url(#grain)" opacity=".9"/>
