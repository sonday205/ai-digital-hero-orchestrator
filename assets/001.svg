<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title description">
  <title id="title">Ảnh chờ nhân vật Tô Vĩnh Diện</title>
  <desc id="description">Minh họa tông màu tươi sáng dùng tạm trước khi cấu hình ảnh 001.jpg trên máy chủ.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff4ff"/>
      <stop offset="0.55" stop-color="#a9ddf7"/>
      <stop offset="1" stop-color="#ffe6a0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="37%" r="44%">
      <stop offset="0" stop-color="#fff8d7" stop-opacity=".92"/>
      <stop offset="1" stop-color="#fff8d7" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
