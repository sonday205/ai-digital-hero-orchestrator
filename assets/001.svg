  <g fill="none" stroke="#ffffff" stroke-opacity=".72">
    <circle cx="450" cy="405" r="318"/>
    <circle cx="450" cy="405" r="286"/>
    <path d="M70 890h760M130 950h640"/>
  </g>
  <g fill="#244a68">
